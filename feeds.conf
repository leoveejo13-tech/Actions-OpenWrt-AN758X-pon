# =========================================================
# feeds.conf —— PonWrt 源码树的 feed 清单（本仓库定制版）
# ------------------------------------------------------------
# 与 pbs05/ponwrt 自带 feeds.conf.default 的唯一差异：
#   pon_userspace: pbs05/openwrt-pon-userspace -> naoki66/OpenWrt_ONU_CONFIG
#   新增 airoha_luci: naoki66/luci-app-airoha
# ------------------------------------------------------------
# naoki66/OpenWrt_ONU_CONFIG 是 pbs05/openwrt-pon-userspace 的重构 fork：
#   - luci-app-pon + luci-app-iptv 合并为顶级菜单 luci-app-onu
#   - airoha-pond / airoha-ponctl / airoha-pon-debug 包名不变
#   - 仓库自带 patches/firewall4/（flowtable zone device 补丁，
#     由 diy-part1.sh 拷贝到 feeds/packages/net/firewall4/patches/）
# workflow 中 FEEDS_CONF=feeds.conf，Update & install feeds 步骤会先用它覆盖
# ⚠ 注意：ponwrt 的 scripts/feeds 解析器只剥「# 后有内容」的注释，
#   光秃秃的单独一行 "#" 会报 Syntax error，注释行必须以 "# " 带内容。
# =========================================================
src-git packages https://github.com/immortalwrt/packages.git
src-git luci https://github.com/immortalwrt/luci.git
src-git routing https://github.com/openwrt/routing.git
src-git telephony https://github.com/openwrt/telephony.git
src-git video https://github.com/openwrt/video.git
src-git pon_drivers https://github.com/pbs05/openwrt-pon-drivers.git
src-git pon_userspace https://github.com/naoki66/OpenWrt_ONU_CONFIG.git
src-git airoha_luci https://github.com/naoki66/luci-app-airoha.git
